when:
  - event: pull_request
    evaluate: 'CI_COMMIT_SOURCE_BRANCH != "weblate" && not(CI_COMMIT_SOURCE_BRANCH startsWith "renovate/")'
  - event: push
    branch: ${CI_REPO_DEFAULT_BRANCH}
  - event: manual
    branch: ${CI_REPO_DEFAULT_BRANCH}

labels:
  platform: linux/amd64
  memory: 'high'

steps:
  build:
    image: docker.io/node:20-alpine
    commands:
      - yarn --frozen-lockfile
      - yarn build
